<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEPY</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="/home">Home</a>
        <a href="/">Camera</a>
    </div>
    <h1>EEPY</h1>
    <div class="main-container">
        <div class="video-container">
            <div class="img-container">
                <img src="{{ url_for('video_feed') }}" alt="Live driver monitoring camera">
            </div>
            <div class="text-container">
                <div class="ear-value">
                    <span>EAR Value:</span>
                    <span id="ear_value">Waiting for data...</span>
                </div>
                <div class="mar-value">
                    <span>MAR Value:</span>
                    <span id="mar_value">Waiting for data...</span>
                </div>
                <div class="ai-response">
                    <span>AI Response:</span>
                    <span id="ai_response">Waiting for data...</span>
                </div>
            </div>
            <div class="drowsy-status">
                <span id="drowsy_value">Drowsiness Status: Waiting for data...</span>
            </div>
            <section class="calibration-diagnostic" aria-labelledby="calibration-quality-label" aria-live="polite">
                <div class="calibration-quality-row">
                    <span id="calibration-quality-label">Calibration frame quality:</span>
                    <span id="calibration_quality" class="calibration-quality calibration-quality--unknown">Waiting for data...</span>
                </div>
                <div class="calibration-reasons">
                    <span>Details:</span>
                    <span id="calibration_reasons">Waiting for data...</span>
                </div>
            </section>
            <button class="button" type="button" onclick="fetchAIOutput()">Get AI Output</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025 <span class="eepy-inline">EEPY</span>. Made with ❤️ at UNIHACK 2025</p>
    </footer>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>

name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake portaudio19-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py $(find vision ai tests -name '*.py')

      - name: Run tests
        run: python -m unittest discover -s tests
